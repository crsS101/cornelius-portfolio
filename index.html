<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hi Sherie ❤️</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(ellipse at bottom, #2a0a0a 0%, #0d0505 100%);
    overflow: hidden;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }

  /* Soft red ambient glow */
  .hearts {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image: 
      radial-gradient(circle at 15% 25%, rgba(255, 50, 50, 0.18) 0%, transparent 50%),
      radial-gradient(circle at 85% 75%, rgba(220, 20, 60, 0.15) 0%, transparent 50%),
      radial-gradient(circle at 50% 50%, rgba(255, 80, 80, 0.08) 0%, transparent 60%);
  }

  /* Floating heart particles */
  .heart-particle {
    position: absolute;
    font-size: 15px;
    color: rgba(255, 100, 100, 0.45);
    animation: floatUp 13s linear infinite;
    opacity: 0;
  }

  .heart-particle:nth-child(1) { left: 8%;  animation-delay: 0s; }
  .heart-particle:nth-child(2) { left: 22%; animation-delay: 2.2s; font-size: 18px; }
  .heart-particle:nth-child(3) { left: 38%; animation-delay: 4s; }
  .heart-particle:nth-child(4) { left: 55%; animation-delay: 1.5s; font-size: 16px; }
  .heart-particle:nth-child(5) { left: 72%; animation-delay: 3.5s; }
  .heart-particle:nth-child(6) { left: 88%; animation-delay: 5.5s; font-size: 13px; }

  @keyframes floatUp {
    0%   { transform: translateY(100vh) scale(0.6); opacity: 0; }
    10%  { opacity: 0.6; }
    90%  { opacity: 0.4; }
    100% { transform: translateY(-10vh) scale(1.1); opacity: 0; }
  }

  /* Outer red glow */
  .glow {
    position: absolute;
    width: 360px;
    height: 360px;
    border-radius: 50%;
    background: radial-gradient(circle, 
      rgba(255, 40, 40, 0.4) 0%, 
      rgba(200, 0, 0, 0.2) 40%,
      transparent 70%);
    animation: pulse 4.5s ease-in-out infinite;
    z-index: -1;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.55; transform: scale(0.94); }
    50%      { opacity: 1;    transform: scale(1.08); }
  }

  /* The shiny red love bubble */
  .bubble {
    position: relative;
    width: 320px;
    height: 320px;
    border-radius: 50%;
    background: 
      radial-gradient(circle at 30% 25%, 
        rgba(255, 255, 255, 0.45) 0%,
        rgba(255, 150, 150, 0.3) 18%,
        rgba(255, 60, 60, 0.25) 40%,
        rgba(180, 0, 0, 0.4) 100%);
    box-shadow: 
      0 0 55px rgba(255, 50, 50, 0.55),
      0 0 110px rgba(220, 0, 0, 0.3),
      inset 0 0 65px rgba(255, 255, 255, 0.18),
      inset 28px 28px 55px rgba(255, 255, 255, 0.35),
      inset -22px -22px 45px rgba(100, 0, 0, 0.35);
    backdrop-filter: blur(10px);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 30px;
    animation: float 6.5s ease-in-out infinite;
  }

  /* Bright specular highlight */
  .bubble::before {
    content: '';
    position: absolute;
    top: 15%;
    left: 18%;
    width: 70px;
    height: 42px;
    border-radius: 50%;
    background: radial-gradient(ellipse, 
      rgba(255, 255, 255, 0.95) 0%,
      rgba(255, 255, 255, 0.5) 40%,
      transparent 70%);
    transform: rotate(-28deg);
    filter: blur(1px);
  }

  /* Soft secondary highlight */
  .bubble::after {
    content: '';
    position: absolute;
    bottom: 18%;
    right: 15%;
    width: 38px;
    height: 24px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.28);
    filter: blur(2px);
  }

  .text {
    position: relative;
    z-index: 2;
    color: #fff;
    font-size: 2.1rem;
    font-weight: 300;
    letter-spacing: 0.03em;
    text-shadow: 
      0 0 16px rgba(255, 120, 120, 0.9),
      0 0 32px rgba(255, 50, 50, 0.6);
    line-height: 1.25;
  }

  .message {
    position: relative;
    z-index: 2;
    margin-top: 12px;
    font-size: 1.15rem;
    font-weight: 300;
    color: rgba(255, 230, 230, 0.95);
    text-shadow: 0 0 12px rgba(255, 100, 100, 0.6);
    line-height: 1.4;
    max-width: 240px;
  }

  .heart {
    font-size: 1.7rem;
    margin-top: 14px;
    animation: heartbeat 1.8s ease-in-out infinite;
  }

  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    15%      { transform: scale(1.28); }
    30%      { transform: scale(1); }
    45%      { transform: scale(1.18); }
    60%      { transform: scale(1); }
  }

  /* Gentle floating */
  @keyframes float {
    0%, 100% {
      transform: translateY(0) scale(1);
    }
    50% {
      transform: translateY(-22px) scale(1.03);
    }
  }
</style>
</head>
<body>
  <div class="hearts"></div>

  <!-- Floating heart particles -->
  <div class="heart-particle">♡</div>
  <div class="heart-particle">♡</div>
  <div class="heart-particle">♡</div>
  <div class="heart-particle">♡</div>
  <div class="heart-particle">♡</div>
  <div class="heart-particle">♡</div>

  <div class="glow"></div>
  <div class="bubble">
    <div class="text">Hi Sherie</div>
    <div class="message">how was your<br>cat exam</div>
    <div class="heart">❤️</div>
  </div>
</body>
</html>
