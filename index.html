
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I Love You, Sherie ❤️</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-family: Georgia, serif;
      color: white;
      background: linear-gradient(135deg, #ff758c, #a00050);
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      max-width: 420px;
      padding: 35px 24px;
      border-radius: 25px;
      background: rgba(255,255,255,0.15);
      box-shadow: 0 10px 35px #59002066;
    }
    .heart { font-size: 60px; }
    h1 { font-size: 36px; }
    p { font-size: 19px; line-height: 1.7; }
  </style>
</head>
<body>
  <div class="card">
    <div class="heart">❤️</div>
    <h1>I Love You, Sherie</h1>
    <p>My love, you are so special to me.</p>
    <p>You have a beautiful place in my heart, and I am grateful to have you in my life.</p>
    <p>I choose you, today and always. 💕</p>
    <h2>Forever yours ❤️</h2>
  </div>
</body>
</html>
