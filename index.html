<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hi Sherie 💕</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(ellipse at bottom, #2a0a1f 0%, #0d0510 100%);
    overflow: hidden;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }

  /* Soft floating hearts background */
  .hearts {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image: 
      radial-gradient(circle at 10% 20%, rgba(255, 105, 180, 0.15) 0%, transparent 50%),
      radial-gradient(circle at 90% 80%, rgba(255, 20, 147, 0.12) 0%, transparent 50%),
      radial-gradient(circle at 50% 50%, rgba(255, 182, 193, 0.08) 0%, transparent 60%);
  }

  /* Tiny floating heart particles */
  .heart-particle {
    position: absolute;
    font-size: 14px;
    color: rgba(255, 150, 200, 0.4);
    animation: floatUp 12s linear infinite;
    opacity: 0;
  }

  .heart-particle:nth-child(1) { left: 10%; animation-delay: 0s; }
  .heart-particle:nth-child(2) { left: 25%; animation-delay: 2s; font-size: 18px; }
  .heart-particle:nth-child(3) { left: 40%; animation-delay: 4s; }
  .heart-particle:nth-child(4) { left: 60%; animation-delay: 1s; font-size: 16px; }
  .heart-particle:nth-child(5) { left: 75%; animation-delay: 3s; }
  .heart-particle:nth-child(6) { left: 90%; animation-delay: 5s; font-size: 12px; }

  @keyframes floatUp {
    0%   { transform: translateY(100vh) scale(0.6); opacity: 0; }
    10%  { opacity: 0.6; }
    90%  { opacity: 0.4; }
    100% { transform: translateY(-10vh) scale(1.1); opacity: 0; }
  }

  /* Outer soft glow */
  .glow {
    position: absolute;
    width: 340px;
    height: 340px;
    border-radius: 50%;
    background: radial-gradient(circle, 
      rgba(255, 105, 180, 0.35) 0%, 
      rgba(255, 20, 147, 0.15) 40%,
      transparent 70%);
    animation: pulse 4.5s ease-in-out infinite;
    z-index: -1;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.6; transform: scale(0.95); }
    50%      { opacity: 1;   transform: scale(1.08); }
  }

  /* The shiny love bubble */
  .bubble {
    position: relative;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    background: 
      radial-gradient(circle at 30% 25%, 
        rgba(255, 255, 255, 0.4) 0%,
        rgba(255, 182, 193, 0.25) 20%,
        rgba(255, 105, 180, 0.2) 45%,
        rgba(199, 21, 133, 0.3) 100%);
    box-shadow: 
      0 0 50px rgba(255, 105, 180, 0.5),
      0 0 100px rgba(255, 20, 147, 0.25),
      inset 0 0 60px rgba(255, 255, 255, 0.2),
      inset 25px 25px 50px rgba(255, 255, 255, 0.35),
      inset -20px -20px 40px rgba(139, 0, 80, 0.3);
    backdrop-filter: blur(10px);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    animation: float 6.5s ease-in-out infinite;
  }

  /* Bright specular highlight */
  .bubble::before {
    content: '';
    position: absolute;
    top: 16%;
    left: 20%;
    width: 65px;
    height: 40px;
    border-radius: 50%;
    background: radial-gradient(ellipse, 
      rgba(255, 255, 255, 0.95) 0%,
      rgba(255, 255, 255, 0.5) 40%,
      transparent 70%);
    transform: rotate(-30deg);
    filter: blur(1px);
  }

  /* Soft secondary highlight */
  .bubble::after {
    content: '';
    position: absolute;
    bottom: 20%;
    right: 16%;
    width: 35px;
    height: 22px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.3);
    filter: blur(2px);
  }

  .text {
    position: relative;
    z-index: 2;
    color: #fff;
    font-size: 2.6rem;
    font-weight: 300;
    letter-spacing: 0.04em;
    text-shadow: 
      0 0 15px rgba(255, 150, 200, 0.9),
      0 0 30px rgba(255, 100, 180, 0.6);
    text-align: center;
    line-height: 1.2;
  }

  .heart {
    font-size: 1.8rem;
    margin-top: 8px;
    animation: heartbeat 1.8s ease-in-out infinite;
  }

  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    15%      { transform: scale(1.25); }
    30%      { transform: scale(1); }
    45%      { transform: scale(1.15); }
    60%      { transform: scale(1); }
  }

  .sub {
    margin-top: 12px;
    font-size: 0.95rem;
    font-weight: 300;
    letter-spacing: 0.2em;
    color: rgba(255, 220, 235, 0.85);
    text-shadow: 0 0 12px rgba(255, 150, 200, 0.5);
  }

  /* Gentle floating */
  @keyframes float {
    0%, 100% {
      transform: translateY(0) scale(1);
    }
    50% {
      transform: translateY(-20px) scale(1.03);
    }
  }
</style>
</head>
<body>
  <div class="hearts"></div>

  <!-- Floating heart particles -->
  <div class="heart-particle">♡</div>
  <div class="heart-particle">♡</div>
  <div class="heart-particle">♡</div>
  <div class="heart-particle">♡</div>
  <div class="heart-particle">♡</div>
  <div class="heart-particle">♡</div>

  <div class="glow"></div>
  <div class="bubble">
    <div class="text">Hi Sherie</div>
    <div class="heart">💕</div>
    <div class="sub">you make my heart smile</div>
  </div>
</body>
</html>
